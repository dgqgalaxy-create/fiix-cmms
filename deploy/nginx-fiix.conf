# FIIX CMMS — nginx reverse proxy (puerto 80 → Express :3000)
# Uso típico en Ubuntu:
#   sudo cp deploy/nginx-fiix.conf /etc/nginx/sites-available/fiix
#   sudo ln -sf /etc/nginx/sites-available/fiix /etc/nginx/sites-enabled/fiix
#   sudo rm -f /etc/nginx/sites-enabled/default   # opcional
#   sudo nginx -t && sudo systemctl reload nginx
#
# Express/PM2 sigue en 3000; nginx es la fachada pública.
# Ajusta server_name si tu hostname no es lpet-cmms.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lpet-cmms;

    # Fotos / evidencias / firmas / zip de importación CSV (~171 MB típico)
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO / conexiones largas
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
