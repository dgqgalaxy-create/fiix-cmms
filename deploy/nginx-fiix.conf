# FIIX CMMS — nginx reverse proxy (puerto 80 → Express :3000)
# Uso típico en Ubuntu:
#   sudo cp deploy/nginx-fiix.conf /etc/nginx/sites-available/fiix
#   sudo ln -sf /etc/nginx/sites-available/fiix /etc/nginx/sites-enabled/fiix
#   sudo rm -f /etc/nginx/sites-enabled/default   # opcional
#   sudo nginx -t && sudo systemctl reload nginx
#
# Express/PM2 sigue en 3000; nginx es la fachada pública.
# Ajusta server_name si tu hostname no es lpet-cmms.
#
# Timeouts (import CSV + zip por Tailscale):
#   408 Request Timeout  → client_body_timeout / client_header_timeout
#                          (cliente lento al enviar el body; default nginx = 60s)
#   504 Gateway Timeout  → proxy_read_timeout (Express tarda en responder tras subir)
#   413 Payload Too Large → client_max_body_size (default nginx = 1m)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lpet-cmms;

    # Fotos / evidencias / firmas / zip de importación CSV (~171 MB típico).
    # 1100M = 2 zips × 500 MB (multer por archivo) + CSV. Default nginx es 1m →
    # Network Error / 413 si esta conf no está en sites-enabled.
    # update.sh pregunta (o UPDATE_NGINX=1); no aplica el conf solo.
    client_max_body_size 1100M;

    # Subida lenta (Tailscale): si entre chunks del body pasan >60s (default),
    # nginx responde 408. 30 minutos evita cortes en zips grandes.
    client_body_timeout 30m;
    client_header_timeout 2m;
    send_timeout 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subidas grandes (zip) + procesamiento CSV/fotos + Socket.IO
        # proxy_read corto → 504 mientras Express descomprime/asigna miles de fotos
        proxy_connect_timeout 2m;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
        # Evita bufferizar todo el zip en disco de nginx antes de enviarlo a Express
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
