name: Despliegue a Ubuntu Server (Docker Compose)

on:
  push:
    branches:
      - main

# Un solo deploy a la vez; cancela el anterior si llega otro push rápido
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Actualizar y desplegar con Docker Compose
        run: |
          set -euo pipefail
          cd ~/fiix-cmms
          git restore .
          git pull --ff-only origin main
          chmod +x ./update.sh ./install.sh ./scripts/*.sh 2>/dev/null || true
          bash ./update.sh
