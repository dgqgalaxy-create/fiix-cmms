services:
  db:
    # Mismo major que el servidor de producción (PG 17): evita incompatibilidades
    # de dump/restore entre entornos (p. ej. SET transaction_timeout de pg_dump 17).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fiix_dev_pass}
      POSTGRES_DB: fiix_cmms
    volumes:
      # Volumen nuevo para PG 17; el antiguo «fiix-cmms_pgdata» (PG 16) se conserva
      # intacto como respaldo por si se necesita volver atrás.
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiix_cmms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-fiix_dev_pass}@db:5432/fiix_cmms?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_jwt}
      BACKUP_DIR: /backups
      # Pon 1 para NO aplicar el esquema al arrancar (p. ej. vas a restaurar un backup).
      SKIP_DB_PUSH: ${SKIP_DB_PUSH:-0}
      # Emergencia: permite a «prisma db push» aplicar cambios destructivos al arrancar.
      # Por defecto 0 → si el esquema pendiente borra datos, el arranque FALLA en lugar
      # de perderlos en silencio (ver docker/entrypoint.sh). No lo pongas en 1 de forma
      # permanente: úsalo solo si entiendes el riesgo y vuelve a 0 después.
      ALLOW_DB_PUSH_DATA_LOSS: ${ALLOW_DB_PUSH_DATA_LOSS:-0}
      # --- Dominio público / proxy inverso (Cloudflare Tunnel, nginx, Tailscale Funnel) ---
      # Orígenes EXTRA permitidos para CORS y Socket.IO, separados por comas.
      # No hay ningún dominio hardcodeado aquí: se define en el .env de la raíz, así que
      # cada instalación puede usar el suyo (y sobrevive a «git restore .» + «git pull»).
      #   Ej.: CORS_ORIGINS="https://cmms.ejemplo.com"
      #   Ej.: CORS_ORIGINS="https://cmms.ejemplo.com,https://otro.ejemplo.com"
      # Si se deja vacío se mantienen los orígenes por defecto: localhost/127.0.0.1,
      # LAN privada (10.x, 172.16-31.x, 192.168.x), CGNAT Tailscale (100.x) y *.ts.net.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Alias de CORS_ORIGINS (mismo efecto si CORS_ORIGINS está vacío). Si defines los
      # dos, gana CORS_ORIGINS. Se pasa para que el alias documentado funcione en Docker.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Google Drive (importación de fotos en CSV/Sheets)
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY:-}
      GOOGLE_DRIVE_ITEMS_FOLDER: ${GOOGLE_DRIVE_ITEMS_FOLDER:-}
      GOOGLE_DRIVE_VENDORS_FOLDER: ${GOOGLE_DRIVE_VENDORS_FOLDER:-}
      GOOGLE_DRIVE_WO_FOLDER: ${GOOGLE_DRIVE_WO_FOLDER:-}
      # Telegram (alertas) y Web Push (notificaciones PWA)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:mantenimiento@localhost}
    ports:
      # Se publica solo en la LAN/Tailscale y para que Cloudflare Tunnel (systemd en el
      # host) pueda alcanzar http://localhost:3000. NO hace falta abrir el puerto en el
      # router ni exponerlo a Internet: cloudflared abre la conexión saliente por HTTPS.
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/backend/uploads
      - data:/app/data
      - backups:/backups

volumes:
  pgdata17:
  uploads:
  data:
  backups:
